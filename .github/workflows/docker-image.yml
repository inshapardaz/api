name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
 
jobs:

  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v3.1.0
        with:
          registry: ${{ env.REGISTRY }}  
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to production
    needs: push_to_registry
    if: github.event_name == 'push'
    runs-on: [self-hosted, production]
    environment: production
    steps:
      - name: Pull latest environment config
        run: git -C ~/code/environment pull --ff-only

      - name: Pull and restart api
        run: |
          cd ~/code/environment/production
          docker compose pull api
          docker compose up -d api

      - name: Verify deployment
        run: |
          check() {
            local url="$1"
            local label="$2"
            for i in $(seq 1 10); do
              if curl -fsS -o /dev/null -w '%{http_code}' "$url" | grep -q '^200$'; then
                echo "$label OK"
                return 0
              fi
              echo "$label not ready yet, retrying ($i/10)..."
              sleep 3
            done
            echo "::error::$label failed at $url"
            return 1
          }

          check "https://api.nawishta.co.uk/health/check" "health/check"
          check "https://api.nawishta.co.uk/libraries?pageNumber=1&pageSize=1" "libraries (DB access)"
